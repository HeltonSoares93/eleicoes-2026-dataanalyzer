name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"
      - name: Navegador para o teste da página (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest -v
