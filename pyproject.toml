[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eleicoes"
version = "0.2.0"
description = "Análise das eleições presidenciais brasileiras (1º e 2º turnos) com dados abertos do TSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.2,<4",
    "numpy>=2.0,<3",
    "pyarrow>=15",
    "pyyaml>=6",
    "pandera>=0.24",
    "matplotlib>=3.8,<4",
    "geopandas>=1.0,<2",
    "scipy>=1.11,<2",
    "libpysal>=4.10",
    "esda>=2.5",
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.4,<2",
    "shap>=0.45",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
notebook = ["jupyter", "ipykernel", "nbformat>=5", "nbclient>=0.10"]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.40", "pre-commit>=3", "nbstripout>=0.7", "nbformat>=5", "nbclient>=0.10", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lento: testes demorados (executam os notebooks)",
    "dados_reais: usam os arquivos reais do TSE em data/ (pulados se não existirem)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "PD008", "PD015"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "B018"]
